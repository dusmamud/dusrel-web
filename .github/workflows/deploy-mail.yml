name: Deploy Mail to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/mail/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-mail.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mail
  cancel-in-progress: false

jobs:
  ci:
    name: CI (typecheck + build + smoke check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck:mail

      - name: Build static export
        run: npm run build:mail
        env:
          NEXT_PUBLIC_AUTH_API_URL: ${{ vars.NEXT_PUBLIC_AUTH_API_URL || 'https://innovative-remove-generally-amber.trycloudflare.com' }}
          NEXT_PUBLIC_MAIL_API_URL: ${{ vars.NEXT_PUBLIC_MAIL_API_URL || 'https://whale-replies-msgid-activation.trycloudflare.com' }}

      - name: Smoke check static output
        run: |
          test -f apps/mail/out/index.html
          test -f apps/mail/out/hi.html
          echo "Mail static output OK: apps/mail/out/index.html and apps/mail/out/hi.html exist"

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:mail
        env:
          NEXT_PUBLIC_AUTH_API_URL: ${{ vars.NEXT_PUBLIC_AUTH_API_URL || 'https://innovative-remove-generally-amber.trycloudflare.com' }}
          NEXT_PUBLIC_MAIL_API_URL: ${{ vars.NEXT_PUBLIC_MAIL_API_URL || 'https://whale-replies-msgid-activation.trycloudflare.com' }}

      - name: Deploy with Wrangler (Direct Upload)
        run: npx wrangler@4 pages deploy apps/mail/out --project-name=dusrel-mail --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
